# Online demo on k3s: one IRIS pod, only /demo/ is public (Traefik + cert-manager).
# Secret ioa-env is created from the repo .env (see README.md), it is not in this file.
apiVersion: v1
kind: Namespace
metadata:
  name: ioa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ioa-cpf
  namespace: ioa
data:
  # Small fixed buffers: the node is shared with other apps. Auto sizing gave 920 MiB RSS on a 7.8 GB host.
  merge.cpf: |
    [config]
    globals=0,0,64,0,0,0
    routines=32
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris
  namespace: ioa
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: iris}
  template:
    metadata:
      labels: {app: iris}
    spec:
      # IRIS needs a CPU with AVX2: label such a node with ioa/iris=true (README.md, step 5).
      nodeSelector:
        ioa/iris: "true"
      # Public resolvers: LLM calls do not depend on the cluster DNS. The pod needs no cluster service names.
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 8.8.8.8]
      containers:
        - name: iris
          image: ioa-k8s:3
          imagePullPolicy: Never
          # Same setup step as run.sh: compile, env -> ^IOA.Config, reviewer, /demo web app, daily reset, start.
          args:
            - --after
            - iris session IRIS -U IRISAPP '##class(InteropOps.Setup).InitAndStartProduction()'
          envFrom:
            - secretRef: {name: ioa-env}
          env:
            - {name: ISC_CPF_MERGE_FILE, value: /cpf/merge.cpf}
            # LIVE via OpenRouter; spend per day stays under IOA_MAX_USD (default 0.50), reset daily.
            - {name: IOA_LIVE, value: "1"}
            - {name: IOA_DEMO, value: "1"}
            - {name: LLM_PROFILE, value: openrouter}
            - {name: LLM_MODEL, value: openai/gpt-6-luna}
            - {name: LLM_PRICE_IN_PER_M, value: "0.10"}
            - {name: LLM_PRICE_OUT_PER_M, value: "0.50"}
            - {name: IOA_DAILY_RESET, value: "1"}
          ports:
            - {name: http, containerPort: 52773}
          volumeMounts:
            - {name: cpf, mountPath: /cpf}
          resources:
            requests: {memory: 768Mi, cpu: 200m}
            limits: {memory: 1536Mi}
          readinessProbe:
            httpGet: {path: /demo/, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: cpf
          configMap: {name: ioa-cpf}
---
apiVersion: v1
kind: Service
metadata:
  name: iris
  namespace: ioa
spec:
  selector: {app: iris}
  ports:
    - {name: http, port: 52773, targetPort: http}
---
# Everything outside /demo/ (portal, /csp/sys, /api/...) redirects to /demo/.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-demo
  namespace: ioa
spec:
  redirectRegex:
    regex: ^https?://([^/]+)/.*
    replacement: https://${1}/demo/
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ioa-demo
  namespace: ioa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: ioa.antonyartsev.com
      http:
        paths:
          - {path: /demo/, pathType: Prefix, backend: {service: {name: iris, port: {name: http}}}}
  tls:
    - {hosts: [ioa.antonyartsev.com], secretName: ioa-tls}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ioa-redirect
  namespace: ioa
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ioa-to-demo@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: ioa.antonyartsev.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: iris, port: {name: http}}}}
  tls:
    - {hosts: [ioa.antonyartsev.com], secretName: ioa-tls}
